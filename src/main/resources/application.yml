spring:
  application:
    name: sellerpro-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sellerpro}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  cache:
    type: simple

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  task:
    execution:
      pool:
        core-size: 5
        max-size: 10
        queue-capacity: 25

server:
  port: ${PORT:8080}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:your-super-secret-key-minimum-256-bits-long-change-in-production}
  expiration: 86400000       # 24 hours
  refresh-expiration: 604800000  # 7 days

aws:
  region: ${AWS_REGION:ap-south-1}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  s3:
    bucket: ${AWS_S3_BUCKET:sellerpro-uploads}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  admin-email: ${ADMIN_EMAIL:admin@sellerpro.in}

razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.sellerpro: DEBUG
    org.springframework.security: INFO
